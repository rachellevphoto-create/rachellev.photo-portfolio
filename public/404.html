<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Racheli Lev Photography</title>
    <script>
      // GitHub Pages has no server routing. This page catches deep links
      // (like /project/winter-gaze), saves the path in the query string,
      // and sends the visitor to index.html, which restores it.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
